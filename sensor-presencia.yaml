# Sensor de presencia: nanoESP32-C6 + HLK-LD2410C  (versión Zigbee)
#
# Conexiones (según la foto):
#   LD2410C VCC -> 5V
#   LD2410C GND -> GND
#   LD2410C OUT -> GPIO9  (NO se usa; ver nota abajo)
#   LD2410C RX  -> GPIO18 (TX del ESP)
#   LD2410C TX  -> GPIO19 (RX del ESP)
#
# Nota: GPIO9 es pin de arranque (strapping) del ESP32-C6. No lo configuramos;
# toda la información llega por UART.
#
# Se comunica con Home Assistant por Zigbee (Zigbee2MQTT), sin WiFi.
# Por Zigbee, ESPHome solo publica binary_sensor, sensor, switch y number.
# Los select y button del radar son internos y se manejan desde
# interruptores/números "puente" que sí viajan por Zigbee.
# Los nombres van sin tildes: Zigbee solo admite ASCII en el nombre.
#
# Para actualizar el firmware: conectar por USB y
#   .venv\Scripts\esphome.exe run sensor-presencia.yaml --device COMx
# La versión por WiFi está en sensor-presencia-wifi.yaml

substitutions:
  name: sensor-presencia
  friendly_name: Sensor presencia

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # La luz solo llega en modo ingeniería: se deja siempre activado
      - delay: 10s
      - switch.turn_on: sw_ingenieria

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # Logs por el USB nativo (puerto "USB JTAG/serial debug unit")
  baud_rate: 115200

zigbee:
  # Z2M cachea la definición autogenerada por modelo: cambiar el nombre al
  # cambiar los endpoints, o reutilizará la definición antigua.
  model: Sensor presencia LD2410C v7
  # Router: va enchufado a la corriente, no depende de un padre y refuerza la malla.
  # (Como dispositivo final perdía el enlace con su padre en el sótano.)
  router: true
  # Al unirse reenvía ajustes y estados: lo publicado antes de unirse se pierde,
  # y un estado que no cambia (p. ej. presencia estática fija) no se reenviaría nunca.
  # Espera 10 s: al unirse nada más arrancar, el radar aún no ha dado datos.
  on_join:
    - delay: 10s
    - script.execute: reenviar_numeros
    - script.execute: reenviar_estados

# Reenvía binarios y lecturas cada 5 min por si se pierde algún mensaje (9 mensajes).
interval:
  - interval: 5min
    then:
      - script.execute: reenviar_estados

uart:
  id: ld2410_uart
  tx_pin: GPIO18
  rx_pin: GPIO19
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: ld2410_uart

# Firmware reducido a propósito: pocos endpoints para que el "configure" de
# Zigbee2MQTT quepa en la tabla de bindings del ESP (con 24 endpoints daba
# TABLE_FULL). La calibración por puertas se hace con la app HLKRadarTool
# por Bluetooth (interruptor "Bluetooth radar").
#
# Envío de valores por Zigbee: todo lleva `report: force`, así el ESP envía
# el valor cuando cambia sin depender del reporting que configure Z2M.
#
# Las distancias y energías cambian sin parar: se envían solo si varían de
# forma apreciable y como mucho cada 5 s, para no saturar la red.
.lecturas: &filtros_lecturas
  - delta: 10
  - throttle: 5s

# ───────────── Lecturas ─────────────
binary_sensor:
  - platform: ld2410
    has_target:
      name: Presencia
      device_class: occupancy
      cluster: device_class   # cluster estándar de ocupación
      report: force
      # El ld2410 lo pone a false por defecto: entonces el primer estado tras
      # arrancar no avisa a Zigbee y, si no cambia (presencia fija), no llega nunca.
      trigger_on_initial_state: true
    has_moving_target:
      name: Movimiento
      report: force
      trigger_on_initial_state: true
    has_still_target:
      name: Presencia estatica
      report: force
      trigger_on_initial_state: true

sensor:
  - platform: ld2410
    detection_distance:
      name: Distancia
      report: force
      filters: *filtros_lecturas
    moving_distance:
      name: Distancia movimiento
      report: force
      filters: *filtros_lecturas
    still_distance:
      name: Distancia estatica
      report: force
      filters: *filtros_lecturas
    moving_energy:
      name: Energia movimiento
      report: force
      filters: *filtros_lecturas
    still_energy:
      name: Energia estatica
      report: force
      filters: *filtros_lecturas
    # Valor de luz del LD2410C (0-255, no son lux). Solo en modo ingeniería; ruidoso.
    # Se pasa a % para que viaje con unidad: así Z2M/HA lo tratan como medida
    # y lo dibujan como gráfica de línea sin configurar nada a mano.
    light:
      name: Luz
      unit_of_measurement: "%"
      # Sin accuracy_decimals: añade el atributo de resolución y entonces Z2M
      # ignora la unidad (el redondeo ya lo hace el filtro).
      report: force
      filters:
        - lambda: return roundf(x * 100.0f / 255.0f);
        - delta: 1
        - throttle: 10s

# ───────────── Ajustes nativos del radar ─────────────
number:
  - platform: ld2410
    timeout:
      name: Tiempo de espera
      report: force
    max_move_distance_gate:
      name: Puerta max movimiento
      report: force
    max_still_distance_gate:
      name: Puerta max estatica
      report: force

# IMPORTANTE: los endpoints Zigbee se asignan por orden de declaración.
# Las entidades nuevas van siempre AL FINAL de su lista para no desplazar
# las existentes (Zigbee2MQTT las identifica por número de endpoint).
switch:
  - platform: ld2410
    bluetooth:
      name: Bluetooth radar
      report: force
    engineering_mode:
      id: sw_ingenieria
      name: Modo ingenieria
      internal: true

  # Puente para el select de resolución (dos opciones)
  - platform: template
    name: Resolucion 20cm   # sin punto: HA no crea la entidad si lo lleva
    report: force
    lambda: |-
      auto i = id(sel_resolucion).active_index();
      return i.has_value() && *i == 0;   // opciones: 0.2m, 0.75m
    turn_on_action:
      - select.set_index: { id: sel_resolucion, index: 0 }
    turn_off_action:
      - select.set_index: { id: sel_resolucion, index: 1 }

  # Puentes para los botones: se encienden, ejecutan y se apagan solos
  - platform: template
    id: sw_reiniciar
    name: Reiniciar radar
    optimistic: true
    report: force
    turn_on_action:
      - button.press: btn_reiniciar
      - delay: 1s
      - switch.turn_off: sw_reiniciar
      - delay: 5s
      - switch.turn_on: sw_ingenieria

  - platform: template
    id: sw_leer
    name: Leer parametros
    optimistic: true
    report: force
    turn_on_action:
      - button.press: btn_leer
      - delay: 1s
      - switch.turn_off: sw_leer
      - delay: 1s
      - script.execute: reenviar_numeros

  - platform: template
    id: sw_reset
    name: Reset fabrica radar
    optimistic: true
    report: force
    turn_on_action:
      - button.press: btn_reset
      - delay: 1s
      - switch.turn_off: sw_reset
      - delay: 5s
      - switch.turn_on: sw_ingenieria

  - platform: template
    id: sw_reiniciar_esp
    name: Reiniciar ESP
    optimistic: true
    report: force
    turn_on_action:
      - delay: 500ms
      - lambda: App.safe_reboot();

script:
  # El componente ld2410 solo publica un ajuste si cambia respecto al valor
  # guardado en el ESP. Esto los vuelve a publicar todos para que Zigbee
  # (report: force) los envíe aunque no hayan cambiado.
  - id: reenviar_numeros
    mode: single
    then:
      - lambda: |-
          for (auto *n : App.get_numbers()) {
            if (n->has_state()) n->publish_state(n->state);
          }

  # Fuerza el reenvío de los binarios aunque no hayan cambiado.
  # Se salta los filtros (el settle descarta valores repetidos): invalida el
  # estado y lo vuelve a fijar, lo que dispara el envío por Zigbee.
  - id: reenviar_estados
    mode: single
    then:
      - lambda: |-
          for (auto *b : App.get_binary_sensors()) {
            if (!b->has_state()) continue;
            bool s = b->state;
            b->invalidate_state();
            b->send_state_internal(s);
          }
          // Lo mismo con las lecturas: el delta no deja pasar un valor repetido,
          // así que lo enviado antes de unirse (p. ej. la luz estable) se perdía.
          for (auto *s : App.get_sensors()) {
            if (s->has_state() && !std::isnan(s->state))
              s->internal_send_state_to_frontend(s->state);
          }

# ───────────── Internos (no viajan por Zigbee) ─────────────
select:
  - platform: ld2410
    distance_resolution:
      id: sel_resolucion
      name: Resolucion distancia
      internal: true

button:
  - platform: ld2410
    restart:
      id: btn_reiniciar
      name: Reiniciar radar btn
      internal: true
    query_params:
      id: btn_leer
      name: Leer parametros btn
      internal: true
    factory_reset:
      id: btn_reset
      name: Reset fabrica btn
      internal: true
