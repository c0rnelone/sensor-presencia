# Sensor de presencia: nanoESP32-C6 + HLK-LD2410C
#
# Conexiones (según la foto):
#   LD2410C VCC -> 5V
#   LD2410C GND -> GND
#   LD2410C OUT -> GPIO9  (NO se usa; ver nota abajo)
#   LD2410C RX  -> GPIO18 (TX del ESP)
#   LD2410C TX  -> GPIO19 (RX del ESP)
#
# Nota: GPIO9 es pin de arranque (strapping) del ESP32-C6. No lo configuramos;
# toda la información llega por UART.

substitutions:
  name: sensor-presencia
  friendly_name: Sensor presencia

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # El UART lo usa el radar, así que los logs van por el USB nativo / WiFi
  baud_rate: 115200

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:   # usa la misma clave que la API

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: ld2410_uart
  tx_pin: GPIO18
  rx_pin: GPIO19
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: ld2410_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presencia
    has_moving_target:
      name: Movimiento
    has_still_target:
      name: Presencia estática
    out_pin_presence_status:
      name: Estado pin OUT
      entity_category: diagnostic

sensor:
  - platform: ld2410
    light:
      name: Luz
    moving_distance:
      name: Distancia movimiento
    still_distance:
      name: Distancia estática
    moving_energy:
      name: Energía movimiento
    still_energy:
      name: Energía estática
    detection_distance:
      name: Distancia detección
  - platform: wifi_signal
    name: Señal WiFi
    update_interval: 60s
  - platform: uptime
    name: Tiempo encendido

switch:
  - platform: ld2410
    engineering_mode:
      name: Modo ingeniería
    bluetooth:
      name: Bluetooth radar

number:
  - platform: ld2410
    timeout:
      name: Tiempo de espera
    light_threshold:
      name: Umbral de luz
    max_move_distance_gate:
      name: Puerta máx. movimiento
    max_still_distance_gate:
      name: Puerta máx. estática

select:
  - platform: ld2410
    distance_resolution:
      name: Resolución distancia
    baud_rate:
      name: Baud rate radar
    light_function:
      name: Función luz
    out_pin_level:
      name: Nivel pin OUT

button:
  - platform: ld2410
    factory_reset:
      name: Reset de fábrica radar
    restart:
      name: Reiniciar radar
    query_params:
      name: Leer parámetros
  - platform: restart
    name: Reiniciar ESP

text_sensor:
  - platform: ld2410
    version:
      name: Firmware radar
    mac_address:
      name: MAC radar
